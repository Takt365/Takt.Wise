# 在推送到默认分支后，用 git-cliff 根据提交历史生成 CHANGELOG.md，只提交到 changelog 分支。
# 该提交以当前 master 为父提交，树中只保留 CHANGELOG.md，从而与默认分支有共同祖先。
# cliff.toml 模板为每条提交附加 author.timestamp（Asia/Shanghai，YYYY-MM-DD）。
# 自动提交信息含 [skip ci]，避免与工作流形成循环触发。
name: Changelog

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.event.head_commit != null &&
       !contains(github.event.head_commit.message, '[skip ci]') &&
       !contains(github.event.head_commit.message, '[skip changelog]'))
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --current --tag ""
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changelog to isolated branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          COMMIT_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          cp CHANGELOG.md /tmp/CHANGELOG.md
          # 以当前 master 为父提交。孤立根提交与默认分支没有共同祖先，GitHub 文件页会报错。
          git checkout -B changelog
          git read-tree --empty
          cp /tmp/CHANGELOG.md CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "chore(changelog): 同步 CHANGELOG ${COMMIT_DATE} [skip ci]"
          git push origin changelog --force
